<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Life Dashboard</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <!-- Storage warning banner -->
    <div id="storage-warning" class="hidden">
      ⚠️ Penyimpanan tidak tersedia. Data tidak akan disimpan untuk sesi ini.
    </div>

    <!-- Header -->
    <header class="site-header">
      <h1 class="site-title">✨ Life Dashboard</h1>
      <button id="theme-toggle-btn" class="btn-icon" aria-label="Toggle tema">🌙</button>
    </header>

    <!-- Main content -->
    <main class="dashboard-grid">

      <!-- Section 1: Greeting -->
      <section id="greeting-section" class="card">
        <div id="clock" aria-live="polite"></div>
        <div id="date"></div>
        <div id="greeting-text"></div>

        <div class="name-form">
          <label for="name-input" class="label-text">Nama kamu:</label>
          <div class="input-row">
            <input
              type="text"
              id="name-input"
              class="input-field"
              placeholder="Masukkan namamu..."
              maxlength="50"
              autocomplete="off"
            />
            <button id="save-name-btn" class="btn btn-primary">Simpan</button>
          </div>
          <span id="name-error" class="error" role="alert"></span>
        </div>
      </section>

      <!-- Section 2: Focus Timer -->
      <section id="timer-section" class="card">
        <h2 class="section-title">⏱ Focus Timer</h2>
        <div id="timer-display" aria-live="polite">25:00</div>
        <div id="timer-notification" class="hidden timer-notification" role="alert"></div>
        <div class="timer-controls">
          <button id="timer-start" class="btn btn-success">▶ Start</button>
          <button id="timer-stop" class="btn btn-danger" disabled>⏸ Stop</button>
          <button id="timer-reset" class="btn btn-secondary">↺ Reset</button>
        </div>
      </section>

      <!-- Section 3: To-Do List -->
      <section id="todo-section" class="card">
        <h2 class="section-title">📝 To-Do List</h2>
        <div class="add-form">
          <div class="input-row">
            <input
              type="text"
              id="todo-input"
              class="input-field"
              placeholder="Tambah tugas baru..."
              maxlength="200"
              autocomplete="off"
            />
            <button id="todo-add-btn" class="btn btn-primary">Tambah</button>
          </div>
          <span id="todo-error" class="error" role="alert"></span>
        </div>
        <ul id="todo-list" class="todo-list"></ul>
        <p id="todo-empty" class="empty-state">Belum ada tugas. Yuk tambah! 🎯</p>
      </section>

      <!-- Section 4: Quick Links -->
      <section id="quicklinks-section" class="card">
        <h2 class="section-title">🔗 Quick Links</h2>
        <div class="add-form">
          <input
            type="text"
            id="link-name-input"
            class="input-field"
            placeholder="Nama link (maks 100 karakter)"
            maxlength="100"
            autocomplete="off"
          />
          <input
            type="url"
            id="link-url-input"
            class="input-field"
            placeholder="https://contoh.com"
            autocomplete="off"
          />
          <button id="link-add-btn" class="btn btn-primary">Tambah Link</button>
          <span id="link-error" class="error" role="alert"></span>
        </div>
        <div id="links-container" class="links-container"></div>
        <p id="links-empty" class="empty-state">Belum ada link. Tambah linkmu! 🔗</p>
      </section>

    </main>

    <script src="js/app.js" defer></script>
  </body>
</html>
